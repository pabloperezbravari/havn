<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVN | Workplace Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;
color:white;
font-family:'Inter',sans-serif;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

overflow:hidden;

}

.container{

text-align:center;
max-width:800px;
padding:40px;

animation:fade 2s ease;

}

.logo{

width:280px;
margin-bottom:60px;

}

.subtitle{

letter-spacing:6px;
font-size:13px;
text-transform:uppercase;
color:#9c9c9c;
margin-bottom:35px;

}

h1{

font-weight:300;
font-size:42px;
line-height:1.35;
margin-bottom:35px;

}

p{

color:#bdbdbd;
font-size:18px;
line-height:1.8;
margin-bottom:60px;

}

.launch{

font-size:14px;
letter-spacing:4px;
text-transform:uppercase;
color:white;

}

.city{

margin-top:25px;
font-size:13px;
color:#6b6b6b;
letter-spacing:3px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0px);

}

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="subtitle">

WORKPLACE INTELLIGENCE

</div>

<h1>

Creating intelligent workplaces<br>
for people and business.

</h1>

<p>

HAVN is redefining how organizations design, experience and evolve their workplaces.

</p>

<div class="launch">

Launching Soon

</div>

<div class="city">

SANTIAGO · CHILE

</div>

</div>

</body>

</html>
